<svg xmlns="http://www.w3.org/2000/svg" width="680" height="572" viewBox="0 0 680 572" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>WHO agent prototype architecture</title>
<desc>Chat frontend, agent service with Agents SDK orchestrator and LLM factory, four tools, Qdrant and the WHO GHO API.</desc>
<style>
  text { font-family: Helvetica, Arial, sans-serif; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; }
  .cont { fill: none; stroke: #888780; stroke-width: 0.8; stroke-dasharray: 4 4; }
  .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
  .gray rect { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.8; }
  .gray .th { fill: #444441; } .gray .ts { fill: #5F5E5A; }
  .purple rect { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.8; }
  .purple .th { fill: #3C3489; } .purple .ts { fill: #534AB7; }
  .teal rect { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.8; }
  .teal .th { fill: #085041; } .teal .ts { fill: #0F6E56; }
  .ctitle { fill: #2C2C2A; font-size: 14px; font-weight: 500; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<rect x="0" y="0" width="680" height="572" fill="#FFFFFF"/>

<g class="gray">
  <rect x="240" y="30" width="200" height="56" rx="8"/>
  <text class="th" x="340" y="49" text-anchor="middle" dominant-baseline="central">Chat frontend</text>
  <text class="ts" x="340" y="68" text-anchor="middle" dominant-baseline="central">Chainlit / Open WebUI</text>
</g>
<line class="arr" x1="340" y1="92" x2="340" y2="112" marker-end="url(#arrow)"/>

<rect class="cont" x="40" y="116" width="600" height="130" rx="16"/>
<text class="ctitle" x="340" y="140" text-anchor="middle" dominant-baseline="central">Agent service (FastAPI, Python)</text>
<g class="purple">
  <rect x="150" y="162" width="170" height="56" rx="8"/>
  <text class="th" x="235" y="181" text-anchor="middle" dominant-baseline="central">Orchestrator</text>
  <text class="ts" x="235" y="200" text-anchor="middle" dominant-baseline="central">OpenAI Agents SDK</text>
</g>
<g class="purple">
  <rect x="360" y="162" width="170" height="56" rx="8"/>
  <text class="th" x="445" y="181" text-anchor="middle" dominant-baseline="central">LLM factory</text>
  <text class="ts" x="445" y="200" text-anchor="middle" dominant-baseline="central">Bonsai 2 (27B)</text>
</g>
<line class="arr" x1="340" y1="252" x2="340" y2="272" marker-end="url(#arrow)"/>

<rect class="cont" x="40" y="276" width="600" height="116" rx="16"/>
<text class="ctitle" x="340" y="298" text-anchor="middle" dominant-baseline="central">Tools called by the agent</text>
<g class="teal">
  <rect x="60" y="316" width="125" height="56" rx="8"/>
  <text class="th" x="122" y="335" text-anchor="middle" dominant-baseline="central">WHO tool</text>
  <text class="ts" x="122" y="354" text-anchor="middle" dominant-baseline="central">OData + cache</text>
</g>
<g class="teal">
  <rect x="205" y="316" width="125" height="56" rx="8"/>
  <text class="th" x="267" y="335" text-anchor="middle" dominant-baseline="central">Retrieval</text>
  <text class="ts" x="267" y="354" text-anchor="middle" dominant-baseline="central">Hybrid search</text>
</g>
<g class="teal">
  <rect x="350" y="316" width="125" height="56" rx="8"/>
  <text class="th" x="412" y="335" text-anchor="middle" dominant-baseline="central">Doc ingest</text>
  <text class="ts" x="412" y="354" text-anchor="middle" dominant-baseline="central">Parse + OCR</text>
</g>
<g class="teal">
  <rect x="495" y="316" width="125" height="56" rx="8"/>
  <text class="th" x="557" y="335" text-anchor="middle" dominant-baseline="central">Vision</text>
  <text class="ts" x="557" y="354" text-anchor="middle" dominant-baseline="central">Image + charts</text>
</g>
<line class="arr" x1="340" y1="398" x2="340" y2="418" marker-end="url(#arrow)"/>

<rect class="cont" x="40" y="422" width="600" height="110" rx="16"/>
<text class="ctitle" x="340" y="444" text-anchor="middle" dominant-baseline="central">Data and sources</text>
<g class="gray">
  <rect x="150" y="462" width="170" height="56" rx="8"/>
  <text class="th" x="235" y="481" text-anchor="middle" dominant-baseline="central">Qdrant</text>
  <text class="ts" x="235" y="500" text-anchor="middle" dominant-baseline="central">Vector search</text>
</g>
<g class="gray">
  <rect x="360" y="462" width="170" height="56" rx="8" stroke-dasharray="4 3"/>
  <text class="th" x="445" y="481" text-anchor="middle" dominant-baseline="central">WHO GHO API</text>
  <text class="ts" x="445" y="500" text-anchor="middle" dominant-baseline="central">External source</text>
</g>
</svg>
