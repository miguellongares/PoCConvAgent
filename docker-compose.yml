services:
  qdrant:
    image: qdrant/qdrant
    ports: ["6333:6333"]
    volumes: ["./qdrant_data:/qdrant/storage"]

  agent:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    depends_on: [qdrant]
    volumes:
      - ./data:/app/data               # uploaded files
      - hf_cache:/root/.cache/huggingface  # embedding/reranker models, downloaded once

volumes:
  hf_cache:
